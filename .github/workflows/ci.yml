name: Studio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate font exports with fontTools
        run: |
          pip install fonttools==4.67.0 brotli==1.2.0
          npm run test:fonts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
